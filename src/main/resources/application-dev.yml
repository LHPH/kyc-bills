spring:
  datasource:
    url: ${DATABASE_URI}
    #url: jdbc:postgresql://localhost:6000/kyc_database?user=kyc_user&password=kyc_pass
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 1
  cloud:
    vault:
      enabled: true
      token: ${kyc.config.vault.token}
      uri: http://localhost:8200
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import: vault://secret/kyc/${spring.profiles.active}/${spring.application.name}

kyc-config:
  page-size: 20

eureka:
  client:
    enabled: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:9100/eureka

logging:
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO
    org.springframework.security: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE